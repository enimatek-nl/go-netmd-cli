name: Build & Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Configure access to private modules
        run: |
          go env -w GOPRIVATE=dev.vaulteq.com
          git config --global url."https://x-access-token:${{ secrets.DEV_VAULTEQ_TOKEN }}@dev.vaulteq.com/".insteadOf "https://dev.vaulteq.com/"
      - name: Build arm64
        run: CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 go build -ldflags "-s -w" -o bin/go-netmd-cli-darwin-arm64 .
      - name: Build amd64
        run: CGO_ENABLED=1 GOOS=darwin GOARCH=amd64 go build -ldflags "-s -w" -o bin/go-netmd-cli-darwin-amd64 .
      - name: Create universal binary
        run: lipo -create bin/go-netmd-cli-darwin-arm64 bin/go-netmd-cli-darwin-amd64 -output bin/go-netmd-cli_darwin_universal
      - uses: actions/upload-artifact@v4
        with:
          name: darwin-universal
          path: bin/go-netmd-cli_darwin_universal

  build-linux:
    runs-on: ubuntu-22.04
    container: alpine:3.20
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: apk add --no-cache git go build-base libusb-dev
      - name: Configure access to private modules
        run: |
          go env -w GOPRIVATE=dev.vaulteq.com
          git config --global url."https://x-access-token:${{ secrets.DEV_VAULTEQ_TOKEN }}@dev.vaulteq.com/".insteadOf "https://dev.vaulteq.com/"
      - name: Build (fully static, musl)
        run: CGO_ENABLED=1 GOOS=linux GOARCH=amd64 CGO_LDFLAGS="-static" go build -ldflags "-s -w" -o bin/go-netmd-cli_linux_amd64 .
      - name: Verify static
        run: file bin/go-netmd-cli_linux_amd64
      - uses: actions/upload-artifact@v4
        with:
          name: linux-amd64
          path: bin/go-netmd-cli_linux_amd64

  build-windows:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install mingw cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip mingw-w64
      - name: Download prebuilt libusb for Windows
        run: |
          wget -q https://github.com/libusb/libusb/releases/download/v1.0.27.2/libusb-1.0.27.2-cosmos7-64bit.zip
          unzip -q libusb-1.0.27.2-cosmos7-64bit.zip -d libusb
      - name: Configure access to private modules
        run: |
          go env -w GOPRIVATE=dev.vaulteq.com
          git config --global url."https://x-access-token:${{ secrets.DEV_VAULTEQ_TOKEN }}@dev.vaulteq.com/".insteadOf "https://dev.vaulteq.com/"
      - name: Build
        run: |
          set -e
          mkdir -p bin
          # locate 64-bit artifacts in the extracted zip
          DLL=$(find libusb -path '*/x64/*' -name libusb-1.0.dll | head -1)
          [ -z "$DLL" ] && DLL=$(find libusb -name libusb-1.0.dll | head -1)
          DLLDIR=$(dirname "$DLL")
          INC=$(dirname "$(find libusb -name libusb.h | head -1)")
          IMPORT=$(find "$DLLDIR" -name 'libusb-1.0.dll.a' | head -1)
          [ -z "$IMPORT" ] && IMPORT=$(find "$DLLDIR" -name '*.lib' | head -1)
          [ -z "$IMPORT" ] && IMPORT=$(find libusb -name '*.lib' | head -1)
          cp "$DLL" bin/libusb-1.0.dll
          CC=x86_64-w64-mingw32-gcc CGO_ENABLED=1 GOOS=windows GOARCH=amd64 \
            CGO_CFLAGS="-I$INC" CGO_LDFLAGS="$IMPORT -static -static-libgcc" \
            go build -ldflags "-s -w" -o bin/go-netmd-cli.exe .
      - name: Package
        run: |
          cd bin
          zip -q -r ../go-netmd-cli_windows_amd64.zip go-netmd-cli.exe libusb-1.0.dll
      - uses: actions/upload-artifact@v4
        with:
          name: windows-amd64
          path: go-netmd-cli_windows_amd64.zip

  release:
    needs: [build-macos, build-linux, build-windows]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Upload to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: main-$(echo ${GITHUB_SHA} | cut -c1-7)
          name: go-netmd-cli main build $(echo ${GITHUB_SHA} | cut -c1-7)
          generate_release_notes: true
          files: |
            dist/darwin-universal/go-netmd-cli_darwin_universal
            dist/linux-amd64/go-netmd-cli_linux_amd64
            dist/windows-amd64/go-netmd-cli_windows_amd64.zip
