name: Build & Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Configure access to private modules
        run: |
          go env -w GOPRIVATE=dev.vaulteq.com
          git config --global url."https://x-access-token:${{ secrets.DEV_VAULTEQ_TOKEN }}@dev.vaulteq.com/".insteadOf "https://dev.vaulteq.com/"
      # PKG_CONFIG_PATH is cleared so cgo links the macOS SDK's libusb
      # (/usr/lib/libusb-1.0.tbd, available for both archs) instead of
      # the arm64-only Homebrew build.
      - name: Build arm64
        run: env PKG_CONFIG_PATH= CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 go build -ldflags "-s -w" -o bin/go-netmd-cli-darwin-arm64 .
      - name: Build amd64
        run: env PKG_CONFIG_PATH= CGO_ENABLED=1 GOOS=darwin GOARCH=amd64 go build -ldflags "-s -w" -o bin/go-netmd-cli-darwin-amd64 .
      - name: Create universal binary
        run: lipo -create bin/go-netmd-cli-darwin-arm64 bin/go-netmd-cli-darwin-amd64 -output bin/go-netmd-cli_darwin_universal
      - uses: actions/upload-artifact@v4
        with:
          name: darwin-universal
          path: bin/go-netmd-cli_darwin_universal

  build-linux:
    runs-on: ubuntu-22.04
    container: alpine:3.20
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: apk add --no-cache git tar build-base libusb-dev
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Configure access to private modules
        run: |
          go env -w GOPRIVATE=dev.vaulteq.com
          git config --global url."https://x-access-token:${{ secrets.DEV_VAULTEQ_TOKEN }}@dev.vaulteq.com/".insteadOf "https://dev.vaulteq.com/"
      - name: Build (fully static, musl)
        run: CGO_ENABLED=1 GOOS=linux GOARCH=amd64 CGO_LDFLAGS="-static" go build -ldflags "-s -w" -o bin/go-netmd-cli_linux_amd64 .
      - name: Verify static
        run: file bin/go-netmd-cli_linux_amd64
      - uses: actions/upload-artifact@v4
        with:
          name: linux-amd64
          path: bin/go-netmd-cli_linux_amd64

  build-windows:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install mingw cross toolchain + autotools
        run: |
          sudo apt-get update
          sudo apt-get install -y wget mingw-w64 automake libtool pkg-config
      - name: Build static libusb for mingw
        run: |
          set -e
          wget -q https://github.com/libusb/libusb/releases/download/v1.0.30/libusb-1.0.30.tar.bz2
          tar xjf libusb-1.0.30.tar.bz2
          cd libusb-1.0.30
          ./bootstrap.sh --host=x86_64-w64-mingw32 --prefix="$PWD/install" --disable-shared --enable-static
          make -j"$(nproc)"
          make install
      - name: Configure access to private modules
        run: |
          go env -w GOPRIVATE=dev.vaulteq.com
          git config --global url."https://x-access-token:${{ secrets.DEV_VAULTEQ_TOKEN }}@dev.vaulteq.com/".insteadOf "https://dev.vaulteq.com/"
      - name: Build
        run: |
          mkdir -p bin
          CC=x86_64-w64-mingw32-gcc CGO_ENABLED=1 GOOS=windows GOARCH=amd64 \
            CGO_CFLAGS="-Ilibusb-1.0.30/install/include" \
            CGO_LDFLAGS="-Llibusb-1.0.30/install/lib -lusb-1.0 -static -static-libgcc -lkernel32 -luser32 -lsetupapi -ladvapi32 -lntdll" \
            go build -ldflags "-s -w" -o bin/go-netmd-cli_windows_amd64.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: windows-amd64
          path: bin/go-netmd-cli_windows_amd64.exe

  release:
    needs: [build-macos, build-linux, build-windows]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Upload to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: main-$(echo ${GITHUB_SHA} | cut -c1-7)
          name: go-netmd-cli main build $(echo ${GITHUB_SHA} | cut -c1-7)
          generate_release_notes: true
          files: |
            dist/darwin-universal/go-netmd-cli_darwin_universal
            dist/linux-amd64/go-netmd-cli_linux_amd64
            dist/windows-amd64/go-netmd-cli_windows_amd64.exe
